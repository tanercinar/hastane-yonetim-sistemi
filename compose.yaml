name: hospital-management-local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: "${HMS_POSTGRES_DB:-hospital_management}"
      POSTGRES_USER: "${HMS_POSTGRES_USER:-hospital_app}"
      POSTGRES_PASSWORD: "${HMS_POSTGRES_PASSWORD:?HMS_POSTGRES_PASSWORD is required; run the local infrastructure start script}"
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${HMS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" --quiet'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - local_backend

  minio:
    build:
      context: ./infrastructure/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: "${HMS_MINIO_ROOT_USER:-hospital_local_admin}"
      MINIO_ROOT_PASSWORD: "${HMS_MINIO_ROOT_PASSWORD:?HMS_MINIO_ROOT_PASSWORD is required; run the local infrastructure start script}"
      MINIO_BROWSER_REDIRECT_URL: "http://127.0.0.1:${HMS_MINIO_CONSOLE_PORT:-9001}"
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "127.0.0.1:${HMS_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${HMS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - local_backend

  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "10"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_LABEL: Hospital Management (MOCK)
    ports:
      - "127.0.0.1:${HMS_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${HMS_MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - local_backend

networks:
  local_backend:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
